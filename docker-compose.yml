name: checkout-bff

# Full stack: `docker compose up -d --build --wait` (returns once the API answers its readiness probe).
# Infra only, to run the app from the IDE: `docker compose up -d mongo redis kafka products-service payment-methods-service`.

services:
  bff:
    build: .
    image: checkout-bff:local
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/checkout
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCTS_SERVICE_URL: http://products-service:8080
      PAYMENT_METHODS_SERVICE_URL: http://payment-methods-service:8080
      # e.g. PAYMENT_GATEWAY_LATENCY=3s docker compose up -d --wait, to demo a double click
      PAYMENT_GATEWAY_LATENCY: ${PAYMENT_GATEWAY_LATENCY:-0ms}
    mem_limit: 768m
    healthcheck:
      # The runtime image has no curl or wget, but it has bash: /dev/tcp sends the request to the readiness probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      products-service:
        condition: service_healthy
      payment-methods-service:
        condition: service_healthy

  mongo:
    image: mongo:9.0.8
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  redis:
    image: redis:8.10.3
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for other containers, EXTERNAL for the host (app running from the IDE)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    mem_limit: 1g
    healthcheck:
      # The CLI is a JVM too: give it a small heap instead of the broker's
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 3s

  products-service:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    ports:
      - "8081:8080"
    volumes:
      - ./mocks/products-service:/home/wiremock:ro
    environment:
      JAVA_OPTS: -Xmx128m
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  payment-methods-service:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    ports:
      - "8082:8080"
    volumes:
      - ./mocks/payment-methods-service:/home/wiremock:ro
    environment:
      JAVA_OPTS: -Xmx128m
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

volumes:
  mongo-data:
